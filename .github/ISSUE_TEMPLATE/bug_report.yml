name: Bug 反馈
description: 报告可复现的 SDK 或示例工程问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 请先确认使用的是已发布版本，并删除日志中的 token、设备标识和业务敏感信息。
  - type: input
    id: version
    attributes:
      label: SDK 版本
      placeholder: 例如 6.5.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Xcode 与 iOS 版本
      placeholder: 例如 Xcode 16 / iOS 18
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供页面入口、操作顺序和预期/实际结果。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 错误信息或脱敏日志
    validations:
      required: false
