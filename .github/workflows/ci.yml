name: CI

run-name: >-
  ${{ github.event_name == 'release' && format('formal-release:{0}:{1}', github.event.release.id, github.event.release.tag_name) || github.event_name == 'workflow_dispatch' && inputs.control_plane_canary && format('control-plane-canary:{0}:{1}:{2}', inputs.canary_candidate_id, inputs.canary_release_id, inputs.dispatch_nonce) || github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'draft_candidate' && format('draft-candidate:{0}:{1}:{2}', inputs.candidate_id, inputs.candidate_release_id, inputs.dispatch_nonce) || format('ci:{0}:{1}', github.event_name, github.ref_name) }}

on:
  push:
    branches: [main]
    tags: ['*.*.*']
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      validation_mode:
        description: 验证模式；repository 兼容旧调用，非空 release_tag 自动推导 formal
        required: false
        default: repository
        type: choice
        options:
          - repository
          - draft_candidate
          - formal_release
      release_tag:
        description: formal_release 必填；repository 传入时按旧调用自动推导正式复验
        required: false
        default: ''
        type: string
      candidate_release_id:
        description: draft_candidate 模式必填：同仓 draft Release 的十进制 ID（不是 tag）
        required: false
        default: ''
        type: string
      candidate_id:
        description: draft_candidate 模式必填：64 位小写 candidateId
        required: false
        default: ''
        type: string
      dispatch_nonce:
        description: draft_candidate 模式必填：32 位小写 dispatch nonce
        required: false
        default: ''
        type: string
      control_plane_canary:
        description: 只验证控制面和同仓 Draft 下载链，不执行 SDK、Simple 或包管理器构建
        required: false
        default: false
        type: boolean
      canary_tag:
        description: control_plane_canary 独占的临时语义版本；不得与当前正式版本相同
        required: false
        default: ''
        type: string
      canary_release_id:
        description: control_plane_canary 使用的同仓 Draft Release ID
        required: false
        default: ''
        type: string
      canary_candidate_id:
        description: control_plane_canary 使用的 64 位小写候选身份
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  RELEASE_TARGET_VERSION: 6.2.4

concurrency:
  group: >-
    ${{ github.event_name == 'release' && format('{0}:formal:{1}', github.workflow, github.event.release.tag_name) || github.event_name == 'workflow_dispatch' && inputs.control_plane_canary && format('{0}:control-plane-canary:{1}:{2}', github.workflow, inputs.canary_candidate_id, inputs.canary_release_id) || github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'draft_candidate' && format('{0}:candidate:{1}:{2}', github.workflow, inputs.candidate_id, inputs.candidate_release_id) || github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && format('{0}:formal:{1}', github.workflow, inputs.release_tag) || format('{0}:ci:{1}:{2}', github.workflow, github.event_name, github.ref) }}
  # 同一候选的复验顺序排队，不取消既有证据；候选与正式 Release 使用不同分组。
  cancel-in-progress: false

jobs:
  resolve-validation-mode:
    name: 解析并限制发布验证模式
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      checkout_ref: ${{ steps.resolve.outputs.checkout_ref }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      candidate_release_id: ${{ steps.resolve.outputs.candidate_release_id }}
      candidate_id: ${{ steps.resolve.outputs.candidate_id }}
      candidate_branch: ${{ steps.resolve.outputs.candidate_branch }}
      dispatch_nonce: ${{ steps.resolve.outputs.dispatch_nonce }}
    steps:
      - id: resolve
        name: 校验事件、ref 与互斥输入（不 checkout、不注入 Token）
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name || '' }}
          REQUESTED_MODE: ${{ inputs.validation_mode || '' }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag || '' }}
          INPUT_CANDIDATE_RELEASE_ID: ${{ inputs.candidate_release_id || '' }}
          INPUT_CANDIDATE_ID: ${{ inputs.candidate_id || '' }}
          INPUT_DISPATCH_NONCE: ${{ inputs.dispatch_nonce || '' }}
          CONTROL_PLANE_CANARY: ${{ inputs.control_plane_canary || false }}
          CANARY_TAG: ${{ inputs.canary_tag || '' }}
          CANARY_RELEASE_ID: ${{ inputs.canary_release_id || '' }}
          CANARY_CANDIDATE_ID: ${{ inputs.canary_candidate_id || '' }}
          TARGET_VERSION: ${{ env.RELEASE_TARGET_VERSION }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          event = os.environ["EVENT_NAME"]
          event_ref = os.environ["EVENT_REF"]
          event_ref_name = os.environ["EVENT_REF_NAME"]
          requested = os.environ["REQUESTED_MODE"].strip() or "repository"
          release_tag = os.environ["INPUT_RELEASE_TAG"].strip()
          candidate_release_id = os.environ["INPUT_CANDIDATE_RELEASE_ID"].strip()
          candidate_id = os.environ["INPUT_CANDIDATE_ID"].strip()
          dispatch_nonce = os.environ["INPUT_DISPATCH_NONCE"].strip()
          candidate_branch = ""
          target_version = os.environ["TARGET_VERSION"].strip()
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", target_version)

          control_plane_canary = os.environ["CONTROL_PLANE_CANARY"] == "true"
          canary_tag = os.environ["CANARY_TAG"].strip()
          canary_release_id = os.environ["CANARY_RELEASE_ID"].strip()
          canary_candidate_id = os.environ["CANARY_CANDIDATE_ID"].strip()

          if not control_plane_canary:
              assert not canary_tag, "非 Canary 模式不得提供 canary_tag"
              assert not canary_release_id, "非 Canary 模式不得提供 canary_release_id"
              assert not canary_candidate_id, "非 Canary 模式不得提供 canary_candidate_id"

          if control_plane_canary:
              assert event == "workflow_dispatch"
              assert requested == "repository"
              assert not release_tag and not candidate_release_id and not candidate_id
              assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", canary_tag)
              assert re.fullmatch(r"[1-9][0-9]*", canary_release_id)
              assert re.fullmatch(r"[0-9a-f]{64}", canary_candidate_id)
              assert re.fullmatch(r"[0-9a-f]{32}", dispatch_nonce)
              canary_branch = f"release-candidate/{canary_tag}-{canary_candidate_id}"
              assert event_ref == f"refs/heads/{canary_branch}"
              assert event_ref_name == canary_branch
              mode = "repository"
              release_tag = ""
              candidate_release_id = ""
              candidate_id = ""
              dispatch_nonce = ""
              checkout_ref = canary_branch
          elif event == "release":
              mode = "formal_release"
              release_tag = os.environ["RELEASE_EVENT_TAG"].strip()
              candidate_release_id = ""
              candidate_id = ""
              dispatch_nonce = ""
              assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", release_tag)
              assert release_tag == target_version, "release 事件版本与当前分发基线不一致"
              checkout_ref = release_tag
          elif event == "workflow_dispatch":
              assert requested in {
                  "repository",
                  "draft_candidate",
                  "formal_release",
              }, requested
              if requested == "draft_candidate":
                  mode = "draft_candidate"
                  assert not release_tag, "draft candidate 不得同时提供 release_tag"
                  assert re.fullmatch(r"[1-9][0-9]*", candidate_release_id), (
                      "draft candidate 必须提供十进制 candidate_release_id"
                  )
                  assert re.fullmatch(r"[0-9a-f]{64}", candidate_id), (
                      "draft candidate 必须提供 64 位小写 candidate_id"
                  )
                  assert re.fullmatch(r"[0-9a-f]{32}", dispatch_nonce), (
                      "draft candidate 必须提供 32 位小写 dispatch_nonce"
                  )
                  branch_match = re.fullmatch(
                      r"release-candidate/([0-9]+\.[0-9]+\.[0-9]+)-([0-9a-f]{64})",
                      event_ref_name,
                  )
                  assert branch_match, "draft candidate 候选分支格式非法"
                  candidate_version, branch_candidate_id = branch_match.groups()
                  assert candidate_version == target_version, (
                      "draft candidate 版本与当前分发基线不一致"
                  )
                  assert branch_candidate_id == candidate_id, (
                      "draft candidate 分支 candidate_id 与输入不一致"
                  )
                  candidate_branch = event_ref_name
                  assert event_ref == f"refs/heads/{candidate_branch}", (
                      f"draft candidate 只允许从 {candidate_branch} 触发"
                  )
                  assert event_ref_name == candidate_branch, (
                      "github.ref_name 与候选分支不一致"
                  )
                  checkout_ref = candidate_branch
              elif requested == "formal_release":
                  mode = "formal_release"
                  assert not candidate_release_id, "正式复验不得提供 candidate_release_id"
                  assert not candidate_id, "正式复验不得提供 candidate_id"
                  assert not dispatch_nonce, "正式复验不得提供 dispatch_nonce"
                  assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", release_tag), (
                      "正式复验必须提供 x.y.z release_tag"
                  )
                  assert release_tag == target_version, "正式复验版本与当前分发基线不一致"
                  checkout_ref = release_tag
              else:
                  assert not candidate_release_id, (
                      "repository 模式不得提供 candidate_release_id"
                  )
                  assert not candidate_id, "repository 模式不得提供 candidate_id"
                  assert not dispatch_nonce, "repository 模式不得提供 dispatch_nonce"
                  if release_tag:
                      # 兼容旧 workflow_dispatch：仅传 release_tag 即正式复验。
                      assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", release_tag), (
                          "旧式 release_tag 必须为 x.y.z"
                      )
                      assert release_tag == target_version, "旧式复验版本与当前分发基线不一致"
                      mode = "formal_release"
                      checkout_ref = release_tag
                  else:
                      mode = "repository"
                      checkout_ref = event_ref
          else:
              mode = "repository"
              release_tag = ""
              candidate_release_id = ""
              candidate_id = ""
              dispatch_nonce = ""
              checkout_ref = event_ref

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"mode={mode}\n")
              handle.write(f"checkout_ref={checkout_ref}\n")
              handle.write(f"release_tag={release_tag}\n")
              handle.write(f"candidate_release_id={candidate_release_id}\n")
              handle.write(f"candidate_id={candidate_id}\n")
              handle.write(f"candidate_branch={candidate_branch}\n")
              handle.write(f"dispatch_nonce={dispatch_nonce}\n")
          print(
              f"mode={mode}, checkout_ref={checkout_ref}, "
              f"release_tag={release_tag or '<none>'}, "
              f"candidate_release_id={candidate_release_id or '<none>'}, "
              f"candidate_id={candidate_id or '<none>'}, "
              f"candidate_branch={candidate_branch or '<none>'}"
          )
          PY

  verify-repository:
    name: 本地校验发布清单、文档与 Demo 生命周期
    needs: resolve-validation-mode
    # Demo 工程由 Xcode 16.2 创建（objectVersion 77），正式消费构建需使用 Xcode 16+ runner。
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # 控制面脚本始终取自本次 workflow 的确切提交；被验证的历史 tag
      # 不需要回填新脚本，也不会因 checkout tag 而执行到过时脚本。
      WORKFLOW_CONTROL_SHA: ${{ github.workflow_sha }}
    outputs:
      mode: ${{ steps.release-contract.outputs.mode }}
      version: ${{ steps.release-contract.outputs.version }}
      release_state: ${{ steps.release-contract.outputs.release_state }}
      release_tag: ${{ steps.release-contract.outputs.release_tag }}
      candidate_release_id: ${{ steps.release-contract.outputs.candidate_release_id }}
      candidate_id: ${{ steps.release-contract.outputs.candidate_id }}
      candidate_branch: ${{ steps.release-contract.outputs.candidate_branch }}
      dispatch_nonce: ${{ steps.release-contract.outputs.dispatch_nonce }}
      checkout_ref: ${{ steps.release-contract.outputs.checkout_ref }}
      checkout_commit: ${{ steps.release-contract.outputs.checkout_commit }}
      candidate_identity: ${{ steps.release-contract.outputs.candidate_identity }}
    steps:
      - name: Checkout 本次 workflow 控制面
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: 运行发布工作流离线回归测试
        run: |
          PYTHONDONTWRITEBYTECODE=1 \
            python3 -B -m unittest discover \
              -s .github/tests \
              -p 'test_*.py'

      - name: 校验机器可读发布状态
        run: |
          state_version="$(python3 -c 'import json; print(json.load(open("release-state.json"))["version"])')"
          python3 scripts/release_state.py release-state.json \
            --expected-channel ys \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-version "$state_version"
          python3 - <<'PY'
          import json
          import os

          state = json.load(open("release-state.json", encoding="utf-8"))
          target = tuple(int(part) for part in os.environ["RELEASE_TARGET_VERSION"].split("."))
          current = tuple(int(part) for part in state["version"].split("."))
          if state["phase"] == "CLOSED":
              assert current <= target, "main CLOSED 版本不得高于当前分发基线"
          else:
              assert current == target, "非 CLOSED 状态必须绑定当前分发基线"
          PY

      - name: Checkout 被验证的发布 ref
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-validation-mode.outputs.checkout_ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - id: release-contract
        name: 优先校验 checkout、版本、最终 FORMAL 清单、A/B 与 candidate 身份
        env:
          VALIDATION_MODE: ${{ needs.resolve-validation-mode.outputs.mode }}
          RELEASE_TAG: ${{ needs.resolve-validation-mode.outputs.release_tag }}
          CANDIDATE_RELEASE_ID: ${{ needs.resolve-validation-mode.outputs.candidate_release_id }}
          CANDIDATE_ID: ${{ needs.resolve-validation-mode.outputs.candidate_id }}
          CANDIDATE_BRANCH: ${{ needs.resolve-validation-mode.outputs.candidate_branch }}
          DISPATCH_NONCE: ${{ needs.resolve-validation-mode.outputs.dispatch_nonce }}
        run: |
          git cat-file -e "${WORKFLOW_CONTROL_SHA}^{commit}"
          git show \
            "${WORKFLOW_CONTROL_SHA}:.github/scripts/validate_release_mode.py" |
            python3 - \
              --mode "${VALIDATION_MODE}" \
              --event-name "${GITHUB_EVENT_NAME}" \
              --event-ref "${GITHUB_REF}" \
              --event-ref-name "${GITHUB_REF_NAME}" \
              --event-ref-type "${GITHUB_REF_TYPE}" \
              --event-sha "${GITHUB_SHA}" \
              --repository "${GITHUB_REPOSITORY}" \
              --release-tag "${RELEASE_TAG}" \
              --candidate-release-id "${CANDIDATE_RELEASE_ID}" \
              --candidate-id "${CANDIDATE_ID}" \
              --candidate-branch "${CANDIDATE_BRANCH}" \
              --dispatch-nonce "${DISPATCH_NONCE}" \
              --github-output "${GITHUB_OUTPUT}"

      - name: 阻断校验版本、checksum 与本地包机器契约
        env:
          VALIDATION_MODE: ${{ needs.resolve-validation-mode.outputs.mode }}
        run: |
          swift package dump-package > "${RUNNER_TEMP}/ys-package.json"
          pod ipc spec YSIFLYADLib.podspec > "${RUNNER_TEMP}/ys-podspec.json"
          git show "${WORKFLOW_CONTROL_SHA}:.github/scripts/verify_repository_contract.py" |
            python3 - \
              --scope machine \
              --release-kind "${VALIDATION_MODE}" \
              --podspec-json "${RUNNER_TEMP}/ys-podspec.json"

      - name: 阻断校验 Markdown 发布状态契约
        env:
          VALIDATION_MODE: ${{ needs.resolve-validation-mode.outputs.mode }}
        run: |
          git show "${WORKFLOW_CONTROL_SHA}:.github/scripts/verify_repository_contract.py" |
            python3 - --scope docs --release-kind "${VALIDATION_MODE}"
      - name: Candidate/正式态校验 A/B 私有源码祖先关系与 B 变更范围
        if: github.ref_type == 'tag' || needs.resolve-validation-mode.outputs.mode != 'repository'
        env:
          IFLY_PRIVATE_SOURCE_TOKEN: ${{ secrets.IFLY_PRIVATE_SOURCE_TOKEN }}
          PRIVATE_SOURCE_REPOSITORY: LJMcarryu/IFLYADLibDemo
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          release_state = json.loads(Path("release-state.json").read_text(encoding="utf-8"))
          binary_source_commit = release_state["binarySourceCommit"]
          release_metadata_commit = release_state["releaseMetadataCommit"]
          assert release_state["phase"] in {"FROZEN", "PUBLISHED", "VERIFIED", "CLOSED"}
          assert re.fullmatch(r"[0-9a-f]{40}", binary_source_commit)
          assert re.fullmatch(r"[0-9a-f]{40}", release_metadata_commit)
          assert binary_source_commit != release_metadata_commit
          token = os.environ.get("IFLY_PRIVATE_SOURCE_TOKEN", "").strip()
          assert token, "正式态缺少 IFLY_PRIVATE_SOURCE_TOKEN，拒绝跳过 A/B 祖先校验"
          repository = os.environ["PRIVATE_SOURCE_REPOSITORY"]
          compare_url = (
              f"https://api.github.com/repos/{repository}/compare/"
              f"{binary_source_commit}...{release_metadata_commit}?per_page=100"
          )
          request = urllib.request.Request(
              compare_url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "User-Agent": "YSIFLYADLib-provenance-gate",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=180) as response:
              comparison = json.load(response)

          assert comparison.get("status") == "ahead", comparison.get("status")
          assert comparison.get("ahead_by", 0) > 0
          assert comparison.get("behind_by") == 0
          assert comparison["base_commit"]["sha"] == binary_source_commit
          assert comparison["merge_base_commit"]["sha"] == binary_source_commit
          commits = comparison.get("commits", [])
          assert len(commits) == comparison.get("total_commits"), (
              "A/B compare 提交分页或截断，拒绝不完整校验"
          )
          assert commits and commits[-1]["sha"] == release_metadata_commit

          def allowed(path):
              return path in {
                  "Package.swift",
                  "README.md",
                  "CONTEXT.md",
              } or path.startswith("docs/")

          files = comparison.get("files", [])
          assert files and len(files) < 300, "A/B compare 文件列表为空或达到截断上限"
          invalid = []
          for item in files:
              paths = [item.get("filename", "")]
              if item.get("previous_filename"):
                  paths.append(item["previous_filename"])
              invalid.extend(path for path in paths if not allowed(path))
          assert not invalid, f"提交 B 修改了非发布元数据路径: {sorted(set(invalid))}"
          print(
              "A/B provenance 通过："
              f"binarySourceCommit={binary_source_commit}, "
              f"releaseMetadataCommit={release_metadata_commit}"
          )
          PY

      - name: Tag push 立即校验 annotated tag 与 checkout 绑定
        if: github.ref_type == 'tag'
        run: |
          test "${GITHUB_REF_NAME}" = "${RELEASE_TARGET_VERSION}"
          test -z "$(git status --porcelain)"
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = 'tag'
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          test "$(git describe --tags --exact-match HEAD)" = "${GITHUB_REF_NAME}"

      - name: 校验 SwiftPM 资源包装 target
        run: |
          test -f spm/YSIFLYADLibResources/YSIFLYADLibResources.swift
          test -d spm/YSIFLYADLibResources/YSAdvSDK.bundle
          test -s spm/YSIFLYADLibResources/YSAdvSDK.bundle/PrivacyInfo.xcprivacy
          plutil -lint spm/YSIFLYADLibResources/YSAdvSDK.bundle/PrivacyInfo.xcprivacy
          grep -q 'name: "YSIFLYADLibResources"' Package.swift
          grep -q '\.copy("YSAdvSDK.bundle")' Package.swift
          python3 - <<'PY'
          from pathlib import Path

          executable_resources = [
              path
              for path in Path("spm/YSIFLYADLibResources/YSAdvSDK.bundle").rglob("*")
              if path.is_file() and path.stat().st_mode & 0o111
          ]
          assert not executable_resources, executable_resources
          PY

      - name: 校验 NativeFeed 托管 API 与 Demo 复用乱序防护
        run: |
          python3 - <<'PY'
          from pathlib import Path

          native = Path(
              "YSIFLYADLibSimple/YSIFLYADLibSimple/biz/native/"
              "YSIFLYNativeViewController.m"
          ).read_text(encoding="utf-8")

          for required in (
              "attachedAdCell",
              "ysifly_attachWithViewBinder:",
              "ysifly_detachAdFromContainerView:",
              "detachAdFromContainer",
              "continueDisplayingAdItemAfterCellDetached",
              "renderAd:",
              "didEndDisplayingCell:",
          ):
              assert required in native, required

          readme = Path("README.md").read_text(encoding="utf-8")
          for required in (
              "allowsExternalClickViews",
              "ysifly_nativeFeedAd:didRejectClickWithError:",
              "YSIFLYAdErrorCodeNativeFeedClickViewsInvalid",
              "ysifly_detachFromCurrentContainer",
          ):
              assert required in readme, required

          for forbidden in (
              "YSIFLYNativeFeedDisplaySession",
              "YSIFLYNativeFeedAdBinding",
              "ysifly_beginDisplaySessionWithError:",
              "ysifly_bindAdWithViewBinder:",
              "ysifly_unbindAd",
              "ysifly_endDisplaySession",
          ):
              assert forbidden not in native, forbidden

          render_at = native.index("- (void)renderAd:")
          render_detach_at = native.index("[self detachAdFromContainer];", render_at)
          render_data_at = native.index("YSIFLYNativeFeedAdData *data", render_at)
          assert render_detach_at < render_data_at, "改写媒体 UI 前必须先按容器 detach"

          did_end_at = native.index("didEndDisplayingCell:")
          logical_lifecycle_at = native.index(
              "#pragma mark - Logical ad item lifecycle", did_end_at
          )
          did_end = native[did_end_at:logical_lifecycle_at]
          detach_at = did_end.index("[adCell detachAdFromContainer]")
          clear_at = did_end.index("self.attachedAdCell = nil")
          retry_at = did_end.index("[self continueDisplayingAdItemAfterCellDetached]")
          assert detach_at < clear_at < retry_at, (
              "旧 didEnd 必须先反注册旧容器，再清 attachedAdCell，最后重试仍可见新 Cell"
          )

          attach_at = native.index(
              "- (BOOL)attachCurrentAdToCell:", logical_lifecycle_at
          )
          continue_at = native.index(
              "- (void)continueDisplayingAdItemAfterCellDetached", attach_at
          )
          attach_method = native[attach_at:continue_at]
          assert attach_method.index("if (self.attachedAdCell == cell)") < (
              attach_method.index("[cell renderAd:ad")
          )
          old_mount_guard = "if (self.attachedAdCell && self.attachedAdCell != cell)"
          assert attach_method.count(old_mount_guard) >= 2, (
              "媒体渲染失败和 attach 失败都必须先保护仍活动的旧挂载"
          )
          assert attach_method.count("[self retireCurrentAdItem]") >= 2

          retire_at = native.index("- (void)retireCurrentAdItem", continue_at)
          retire_method = native[retire_at:]
          release_at = retire_method.index("self.adItem.ad = nil")
          detach_attached_at = retire_method.index("[attachedCell detachAdFromContainer]")
          delegate_at = retire_method.index("ad.delegate = nil")
          assert release_at < detach_attached_at < delegate_at
          print("NativeFeed Demo 托管生命周期与 UIKit 新旧 Cell 乱序防护通过")
          PY

  control-plane-canary:
    name: 控制面 Canary（真实 Draft 下载链）
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.control_plane_canary }}
    needs: [resolve-validation-mode, verify-repository]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: 校验 Canary 身份并认证下载精确 Draft 资产
        env:
          GITHUB_TOKEN: ${{ secrets.DRAFT_RELEASE_READ_TOKEN }}
          CANARY_TAG: ${{ inputs.canary_tag }}
          CANARY_RELEASE_ID: ${{ inputs.canary_release_id }}
          CANARY_CANDIDATE_ID: ${{ inputs.canary_candidate_id }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
        run: |
          set -euo pipefail
          [[ "$CANARY_RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANARY_CANDIDATE_ID" =~ ^[0-9a-f]{64}$ ]]
          [[ "$DISPATCH_NONCE" =~ ^[0-9a-f]{32}$ ]]
          state_version="$(python3 -c 'import json; print(json.load(open("release-state.json"))["version"])')"
          test "$CANARY_TAG" != "$state_version"
          canary_branch="release-candidate/${CANARY_TAG}-${CANARY_CANDIDATE_ID}"
          test "$GITHUB_REF" = "refs/heads/$canary_branch"
          python3 scripts/release_state.py release-state.json \
            --expected-channel ys \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-version "$state_version"
          python3 .github/scripts/download_release_assets.py \
            --mode draft_candidate \
            --repository "$GITHUB_REPOSITORY" \
            --version "$CANARY_TAG" \
            --expected-commit "$(git rev-parse HEAD)" \
            --candidate-release-id "$CANARY_RELEASE_ID" \
            --candidate-id "$CANARY_CANDIDATE_ID" \
            --target-branch "$canary_branch" \
            --release-state release-state.json \
            --destination "$RUNNER_TEMP/control-plane-canary-assets"

      - name: 运行 Pod 符号链接与多行 Objective-C selector 轻量夹具
        run: |
          python3 scripts/release_control_plane_checks.py fixture \
            --module-name YSIFLYADLib \
            --header-name IFLYNativeFeedAd.h \
            --selector 'ysifly_nativeFeedAd:didRejectClickWithError:'

  validate-release-assets:
    name: 前置校验 draft/formal Release 三资产
    if: needs.resolve-validation-mode.outputs.mode != 'repository'
    needs: [resolve-validation-mode, verify-repository]
    runs-on: macos-15
    timeout-minutes: 55
    permissions:
      contents: read
    outputs:
      spm_sha256: ${{ steps.asset-contract.outputs.spm_sha256 }}
      combined_sha256: ${{ steps.asset-contract.outputs.combined_sha256 }}
      checksums_sha256: ${{ steps.asset-contract.outputs.checksums_sha256 }}
      release_id: ${{ steps.release-identity.outputs.release_id }}
    env:
      RELEASE_MODE: ${{ needs.verify-repository.outputs.mode }}
      RELEASE_TAG: ${{ needs.verify-repository.outputs.version }}
      CANDIDATE_RELEASE_ID: ${{ needs.verify-repository.outputs.candidate_release_id }}
      CANDIDATE_ID: ${{ needs.verify-repository.outputs.candidate_id }}
      CANDIDATE_BRANCH: ${{ needs.verify-repository.outputs.candidate_branch }}
      EXPECTED_CHECKOUT_COMMIT: ${{ needs.verify-repository.outputs.checkout_commit }}
      WORKFLOW_CONTROL_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-repository.outputs.checkout_commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: 校验资产 job checkout 与前置身份未漂移
        run: |
          xcodebuild -version
          test "$(git rev-parse HEAD)" = "${EXPECTED_CHECKOUT_COMMIT}"
          test -z "$(git status --porcelain)"

      - name: 正式匿名下载前清空 Release 目录与包管理器缓存
        if: env.RELEASE_MODE == 'formal_release'
        run: |
          rm -rf \
            "${RUNNER_TEMP}/ys-release" \
            "${HOME}/Library/Caches/org.swift.swiftpm" \
            "${HOME}/.swiftpm/cache" \
            "${HOME}/Library/Caches/CocoaPods/Pods"

      - name: 使用 Token 从同仓 draft Release 下载精确三资产
        if: env.RELEASE_MODE == 'draft_candidate'
        env:
          # draft Token 只在本步骤出现；checkout、本地门禁及后续消费均不注入。
          GITHUB_TOKEN: ${{ secrets.DRAFT_RELEASE_READ_TOKEN }}
        run: |
          rm -rf "${RUNNER_TEMP}/ys-release"
          git show \
            "${WORKFLOW_CONTROL_SHA}:.github/scripts/download_release_assets.py" |
            python3 - \
              --mode draft_candidate \
              --repository "${GITHUB_REPOSITORY}" \
              --version "${RELEASE_TAG}" \
              --expected-commit "${EXPECTED_CHECKOUT_COMMIT}" \
              --candidate-release-id "${CANDIDATE_RELEASE_ID}" \
              --candidate-id "${CANDIDATE_ID}" \
              --target-branch "${CANDIDATE_BRANCH}" \
              --release-metadata-output "${RUNNER_TEMP}/ys-release-metadata.json" \
              --destination "${RUNNER_TEMP}/ys-release"

      - name: 无 Token 匿名下载已发布正式 Release 精确三资产
        if: env.RELEASE_MODE == 'formal_release'
        run: |
          env \
            -u GH_TOKEN \
            -u GITHUB_TOKEN \
            -u GITHUB_AUTH_TOKEN \
            -u ACTIONS_RUNTIME_TOKEN \
            bash -e -o pipefail -c '
              git show \
                "${WORKFLOW_CONTROL_SHA}:.github/scripts/download_release_assets.py" |
                python3 - \
                  --mode formal_release \
                  --repository "${GITHUB_REPOSITORY}" \
                  --version "${RELEASE_TAG}" \
                  --expected-commit "${EXPECTED_CHECKOUT_COMMIT}" \
                  --release-metadata-output "${RUNNER_TEMP}/ys-release-metadata.json" \
                  --destination "${RUNNER_TEMP}/ys-release"
            '

      - id: release-identity
        name: 固化本次 Release ID
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "ys-release-metadata.json").read_text(
                  encoding="utf-8"
              )
          )
          release_id = release.get("id")
          assert isinstance(release_id, int) and not isinstance(release_id, bool)
          assert release_id > 0, release_id
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"release_id={release_id}\n")
          PY

      - id: asset-contract
        name: 逐项校验 SHA-256、SwiftPM checksum、双包结构与公开 API
        run: |
          export RELEASE_DIR="${RUNNER_TEMP}/ys-release"
          python3 - <<'PY'
          import hashlib
          import os
          import plistlib
          import re
          import subprocess
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          sys.path.insert(0, str(Path("scripts").resolve()))
          from release_control_plane_checks import validate_public_header_selectors

          root = Path(os.environ["RELEASE_DIR"])
          version = os.environ["RELEASE_TAG"]
          release_mode = os.environ["RELEASE_MODE"]
          spm_name = "YSIFLYADLib.xcframework.zip"
          combined_name = f"YSIFLYADLib-{version}.zip"
          expected_files = {spm_name, combined_name, "checksums.txt"}
          actual_files = {path.name for path in root.iterdir() if path.is_file()}
          assert actual_files == expected_files, (actual_files, expected_files)

          lines = [
              line
              for line in (root / "checksums.txt").read_text(
                  encoding="utf-8"
              ).splitlines()
              if line.strip()
          ]
          assert len(lines) == 2, lines
          spm_line = re.fullmatch(
              r"SPM\s+(\S+)\s+spm_checksum=([0-9a-f]{64})\s+"
              r"sha256=([0-9a-f]{64})",
              lines[0],
          )
          combined_line = re.fullmatch(
              r"Combined\s+(\S+)\s+sha256=([0-9a-f]{64})",
              lines[1],
          )
          assert spm_line and combined_line, lines
          assert spm_line.group(1) == spm_name
          assert combined_line.group(1) == combined_name

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          spm_path = root / spm_name
          combined_path = root / combined_name
          spm_sha = sha256(spm_path)
          combined_sha = sha256(combined_path)
          checksums_sha = sha256(root / "checksums.txt")
          computed_spm = subprocess.check_output(
              ["swift", "package", "compute-checksum", str(spm_path)],
              text=True,
          ).strip()
          package = Path("Package.swift").read_text(encoding="utf-8")
          declared_spm = re.search(r'checksum:\s*"([^"]+)"', package).group(1)
          assert spm_line.group(2) == spm_line.group(3) == spm_sha
          assert computed_spm == spm_sha
          assert release_mode in {"draft_candidate", "formal_release"}
          assert declared_spm == spm_sha, (
              "Draft/正式清单 checksum 必须等于本次下载资产"
          )
          assert combined_line.group(2) == combined_sha

          def safe_extract(archive_path, output):
              with zipfile.ZipFile(archive_path) as archive:
                  for info in archive.infolist():
                      name = PurePosixPath(info.filename)
                      assert not name.is_absolute() and ".." not in name.parts, name
                  archive.extractall(output)

          spm_out = root / "spm"
          combined_out = root / "combined"
          safe_extract(spm_path, spm_out)
          safe_extract(combined_path, combined_out)

          def top_level_entries(path):
              return {
                  item.name
                  for item in path.iterdir()
                  if item.name != "__MACOSX" and not item.name.startswith("._")
              }

          assert top_level_entries(spm_out) == {"YSIFLYADLib.xcframework"}
          assert top_level_entries(combined_out) == {
              "YSIFLYADLib.xcframework",
              "YSAdvSDK.bundle",
              "LICENSE",
          }

          def tree_hashes(path):
              return {
                  file.relative_to(path).as_posix(): sha256(file)
                  for file in path.rglob("*")
                  if file.is_file()
                  and not file.name.startswith("._")
                  and file.name != ".DS_Store"
              }

          spm_framework = spm_out / "YSIFLYADLib.xcframework"
          combined_framework = combined_out / "YSIFLYADLib.xcframework"
          validate_public_header_selectors(
              spm_out,
              ["YSIFLYADLib.xcframework/*/YSIFLYADLib.framework/Headers/IFLYNativeFeedAd.h"],
              ["ysifly_nativeFeedAd:didRejectClickWithError:"],
          )
          assert tree_hashes(spm_framework) == tree_hashes(combined_framework)
          assert tree_hashes(Path("spm/YSIFLYADLibResources/YSAdvSDK.bundle")) == (
              tree_hashes(combined_out / "YSAdvSDK.bundle")
          )
          bundle_privacy = combined_out / "YSAdvSDK.bundle/PrivacyInfo.xcprivacy"
          assert bundle_privacy.is_file()
          assert (combined_out / "LICENSE").is_file()

          expected_headers = {
              "IFLYAdBase.h",
              "IFLYAdConfig.h",
              "IFLYAdError.h",
              "IFLYAdKeys.h",
              "IFLYAdSDK.h",
              "IFLYAdTool.h",
              "IFLYAdTypes.h",
              "IFLYBannerAd.h",
              "IFLYInterstitialAd.h",
              "IFLYNativeFeedAd.h",
              "IFLYNativeFeedAdData.h",
              "IFLYSplashAd.h",
              "YSIFLYADLib.h",
          }
          white_labeled_reject_callback = re.compile(
              r"(?m)^[ \t]*-[ \t]*\([^\)\r\n]+\)[ \t]*ysifly_nativeFeedAd[ \t]*:[ \t]*\([^\)\r\n]+\)[ \t]*[A-Za-z_][A-Za-z0-9_]*[ \t\r\n]+didRejectClickWithError[ \t]*:[ \t]*\([^\)\r\n]+\)[ \t]*[A-Za-z_][A-Za-z0-9_]*[ \t]*;"
          )
          headers = b"\n".join(
              path.read_bytes() for path in spm_framework.rglob("Headers/*.h")
          )
          binaries = list(
              spm_framework.rglob("YSIFLYADLib.framework/YSIFLYADLib")
          )
          assert headers and len(binaries) == 2, [str(path) for path in binaries]
          for symbol in (
              b"ysifly_attachWithViewBinder:",
              b"ysifly_detachAdFromContainerView:",
              b"ysifly_detachFromCurrentContainer",
              b"allowsExternalClickViews",
              b"YSIFLYAdErrorCodeNativeFeedClickViewsInvalid",
              b"ysifly_destroy",
          ):
              assert symbol in headers, symbol
          assert white_labeled_reject_callback.search(headers.decode("utf-8")), (
              "缺少白标 NativeFeed 点击拒绝回调 selector"
          )
          for symbol in (
              b"YSIFLYNativeFeedDisplaySession",
              b"YSIFLYNativeFeedAdBinding",
              b"ysifly_beginDisplaySessionWithError:",
              b"ysifly_bindAdWithViewBinder:",
              b"ysifly_unbindAd",
              b"ysifly_endDisplaySession",
          ):
              assert symbol not in headers, symbol

          team_ids = set()
          device_arch_valid = False
          simulator_arch_valid = False
          for binary in binaries:
              framework_dir = binary.parent
              header_names = {
                  path.name for path in (framework_dir / "Headers").glob("*.h")
              }
              assert header_names == expected_headers, (
                  framework_dir,
                  header_names,
                  expected_headers,
              )
              native_header = framework_dir / "Headers/IFLYNativeFeedAd.h"
              native_text = native_header.read_text(encoding="utf-8")
              error_text = (framework_dir / "Headers/IFLYAdError.h").read_text(
                  encoding="utf-8"
              )
              for managed_api in (
                  "ysifly_attachWithViewBinder:",
                  "ysifly_detachAdFromContainerView:",
                  "ysifly_detachFromCurrentContainer",
                  "allowsExternalClickViews",
                  "ysifly_destroy",
              ):
                  assert managed_api in native_text, managed_api
              assert white_labeled_reject_callback.search(native_text), (
                  "缺少白标 NativeFeed 点击拒绝回调 selector"
              )
              assert "YSIFLYAdErrorCodeNativeFeedClickViewsInvalid = 71503" in error_text

              subprocess.check_call(
                  ["codesign", "--verify", "--strict", "--verbose=2", str(framework_dir)]
              )
              signature = subprocess.check_output(
                  ["codesign", "-d", "--verbose=4", str(framework_dir)],
                  text=True,
                  stderr=subprocess.STDOUT,
              )
              assert "Signature=adhoc" not in signature
              team_match = re.search(r"(?m)^TeamIdentifier=(.+)$", signature)
              assert team_match, signature
              team_ids.add(team_match.group(1).strip())

              lines = set(
                  subprocess.check_output(
                      ["strings", str(binary)], text=True, errors="replace"
                  ).splitlines()
              )
              for selector in (
                  "ysifly_attachWithViewBinder:error:",
                  "ysifly_detachAdFromContainerView:",
                  "ysifly_detachFromCurrentContainer",
                  "allowsExternalClickViews",
                  "ysifly_nativeFeedAd:didRejectClickWithError:",
              ):
                  assert selector in lines, (selector, binary)
              for selector in (
                  "attachWithViewBinder:error:",
                  "detachAdFromContainerView:",
                  "detachFromCurrentContainer",
                  "nativeFeedAd:didRejectClickWithError:",
                  "ysifly_allowsExternalClickViews",
                  "ysifly_setAllowsExternalClickViews:",
                  "ysifly_beginDisplaySessionWithError:",
                  "ysifly_bindAdWithViewBinder:error:",
                  "ysifly_unbindAd",
                  "ysifly_endDisplaySession",
              ):
                  assert selector not in lines, (selector, binary)

              symbols = subprocess.check_output(
                  ["nm", "-g", str(binary)], text=True, errors="replace"
              )
              assert "_OBJC_CLASS_$_YSIFLYBannerAd" in symbols
              assert "_OBJC_CLASS_$_YSIFLYInterstitialAd" in symbols
              assert "_OBJC_CLASS_$_YSIFLYSplashAd" in symbols
              assert "YSIFLYReward" not in symbols

              architectures = set(
                  subprocess.check_output(
                      ["lipo", "-archs", str(binary)], text=True
                  ).split()
              )
              if "simulator" in binary.as_posix():
                  simulator_arch_valid |= architectures == {"arm64", "x86_64"}
              else:
                  device_arch_valid |= architectures == {"arm64"}

              info = plistlib.loads((framework_dir / "Info.plist").read_bytes())
              assert info["MinimumOSVersion"] == "11.0", (binary, info)
              assert info["CFBundleShortVersionString"] == version, (binary, info)

          assert team_ids == {"FM295M5CZ5"}, team_ids
          assert device_arch_valid and simulator_arch_valid
          privacy_paths = [
              *spm_framework.rglob("PrivacyInfo.xcprivacy"),
              bundle_privacy,
          ]
          assert len(privacy_paths) == 3, [str(path) for path in privacy_paths]
          for privacy_path in privacy_paths:
              privacy = plistlib.loads(privacy_path.read_bytes())
              assert privacy.get("NSPrivacyTracking") is True, privacy_path
              assert privacy.get("NSPrivacyTrackingDomains"), privacy_path

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"spm_sha256={spm_sha}\n")
              output.write(f"combined_sha256={combined_sha}\n")
              output.write(f"checksums_sha256={checksums_sha}\n")

          print(
              f"SPM sha256/checksum={spm_sha}; Combined sha256={combined_sha}; "
              "双包、YSNoReward 能力、签名/架构/版本与 NativeFeed API 契约通过"
          )
          PY

      - name: 仅固化已公开的正式资产供并行消费 jobs 使用
        if: env.RELEASE_MODE == 'formal_release'
        uses: actions/upload-artifact@v4
        with:
          name: ys-release-assets-${{ needs.verify-repository.outputs.candidate_identity }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ys-release/YSIFLYADLib.xcframework.zip
            ${{ runner.temp }}/ys-release/YSIFLYADLib-${{ needs.verify-repository.outputs.version }}.zip
            ${{ runner.temp }}/ys-release/checksums.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  consume-swiftpm-release:
    name: 实际消费已验证 SwiftPM 资产
    if: needs.resolve-validation-mode.outputs.mode != 'repository'
    needs: [resolve-validation-mode, verify-repository, validate-release-assets]
    runs-on: macos-15
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      RELEASE_MODE: ${{ needs.verify-repository.outputs.mode }}
      RELEASE_TAG: ${{ needs.verify-repository.outputs.version }}
      CANDIDATE_RELEASE_ID: ${{ needs.verify-repository.outputs.candidate_release_id }}
      CANDIDATE_ID: ${{ needs.verify-repository.outputs.candidate_id }}
      CANDIDATE_BRANCH: ${{ needs.verify-repository.outputs.candidate_branch }}
      EXPECTED_CHECKOUT_COMMIT: ${{ needs.verify-repository.outputs.checkout_commit }}
      EXPECTED_SPM_SHA256: ${{ needs.validate-release-assets.outputs.spm_sha256 }}
      EXPECTED_COMBINED_SHA256: ${{ needs.validate-release-assets.outputs.combined_sha256 }}
      EXPECTED_CHECKSUMS_SHA256: ${{ needs.validate-release-assets.outputs.checksums_sha256 }}
      WORKFLOW_CONTROL_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-repository.outputs.checkout_commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: 校验 SwiftPM 消费 checkout 与前置提交绑定
        run: |
          test "$(git rev-parse HEAD)" = "${EXPECTED_CHECKOUT_COMMIT}"
          test -z "$(git status --porcelain)"

      - name: 正式模式下载前置 job 固化的公开资产
        if: env.RELEASE_MODE == 'formal_release'
        uses: actions/download-artifact@v4
        with:
          name: ys-release-assets-${{ needs.verify-repository.outputs.candidate_identity }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ys-release

      - name: Draft SwiftPM 消费端独立下载三资产
        if: env.RELEASE_MODE == 'draft_candidate'
        env:
          # Token 只存在本下载步骤；后续哈希绑定与构建步骤均不注入。
          GITHUB_TOKEN: ${{ secrets.DRAFT_RELEASE_READ_TOKEN }}
        run: |
          rm -rf "${RUNNER_TEMP}/ys-release"
          git show \
            "${WORKFLOW_CONTROL_SHA}:.github/scripts/download_release_assets.py" |
            python3 - \
              --mode draft_candidate \
              --repository "${GITHUB_REPOSITORY}" \
              --version "${RELEASE_TAG}" \
              --expected-commit "${EXPECTED_CHECKOUT_COMMIT}" \
              --candidate-release-id "${CANDIDATE_RELEASE_ID}" \
              --candidate-id "${CANDIDATE_ID}" \
              --target-branch "${CANDIDATE_BRANCH}" \
              --destination "${RUNNER_TEMP}/ys-release"

      - name: 无 Token 校验 SwiftPM 消费资产与前置哈希完全绑定
        run: |
          unset GH_TOKEN GITHUB_TOKEN GITHUB_AUTH_TOKEN ACTIONS_RUNTIME_TOKEN
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "ys-release"
          version = os.environ["RELEASE_TAG"]
          expected = {
              "YSIFLYADLib.xcframework.zip": os.environ["EXPECTED_SPM_SHA256"],
              f"YSIFLYADLib-{version}.zip": os.environ["EXPECTED_COMBINED_SHA256"],
              "checksums.txt": os.environ["EXPECTED_CHECKSUMS_SHA256"],
          }
          actual = {path.name for path in root.iterdir()}
          assert actual == set(expected), (actual, set(expected))
          for name, expected_sha in expected.items():
              assert len(expected_sha) == 64
              actual_sha = hashlib.sha256((root / name).read_bytes()).hexdigest()
              assert actual_sha == expected_sha, (name, actual_sha, expected_sha)
          print("SwiftPM 消费资产与前置 SHA-256 绑定通过")
          PY

      - name: 正式首次 SwiftPM 消费前显式清空缓存
        if: env.RELEASE_MODE == 'formal_release'
        run: |
          rm -rf \
            "${HOME}/Library/Caches/org.swift.swiftpm" \
            "${HOME}/.swiftpm/cache" \
            "${RUNNER_TEMP}/ys-spm-package" \
            "${RUNNER_TEMP}/ys-spm-derived"

      - name: 使用本次 Release 产物实际构建 SwiftPM 产品和最小消费端
        run: |
          unset GH_TOKEN GITHUB_TOKEN GITHUB_AUTH_TOKEN ACTIONS_RUNTIME_TOKEN
          export RELEASE_DIR="${RUNNER_TEMP}/ys-release"
          rm -rf "${RELEASE_DIR}/spm"
          mkdir -p "${RELEASE_DIR}/spm"
          ditto -x -k \
            "${RELEASE_DIR}/YSIFLYADLib.xcframework.zip" \
            "${RELEASE_DIR}/spm"
          test "$(find "${RELEASE_DIR}/spm" -mindepth 1 -maxdepth 1 -print | wc -l | tr -d '[:space:]')" = 1
          test -d "${RELEASE_DIR}/spm/YSIFLYADLib.xcframework"
          mkdir -p "${RUNNER_TEMP}/ys-spm-package/spm"
          git show \
            "${WORKFLOW_CONTROL_SHA}:.github/fixtures/swiftpm-local/Package.swift" \
            > "${RUNNER_TEMP}/ys-spm-package/Package.swift"
          cp -R "${RELEASE_DIR}/spm/YSIFLYADLib.xcframework" \
            "${RUNNER_TEMP}/ys-spm-package/YSIFLYADLib.xcframework"
          cp -R spm/YSIFLYADLibResources \
            "${RUNNER_TEMP}/ys-spm-package/spm/YSIFLYADLibResources"

          (
            cd "${RUNNER_TEMP}/ys-spm-package"
            xcodebuild build \
              -scheme YSIFLYADLibReleaseValidation \
              -configuration Debug \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "${RUNNER_TEMP}/ys-spm-derived" \
              CODE_SIGNING_ALLOWED=NO \
              IPHONEOS_DEPLOYMENT_TARGET=11.0 \
              OTHER_LDFLAGS='$(inherited) -ObjC'
          )

          test -d \
            "${RUNNER_TEMP}/ys-spm-derived/Build/Products/Debug-iphonesimulator/YSIFLYADLibReleaseValidation_YSIFLYADLibResources.bundle/YSAdvSDK.bundle"
          test -f \
            "${RUNNER_TEMP}/ys-spm-derived/Build/Products/Debug-iphonesimulator/YSIFLYADLibReleaseValidation_YSIFLYADLibResources.bundle/YSAdvSDK.bundle/PrivacyInfo.xcprivacy"

          spm_product_dir="${RUNNER_TEMP}/ys-spm-derived/Build/Products/Debug-iphonesimulator"
          simulator_sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun clang \
            -ObjC \
            -fobjc-arc \
            -isysroot "${simulator_sdk}" \
            -target arm64-apple-ios11.0-simulator \
            -F "${spm_product_dir}" \
            -framework YSIFLYADLib \
            -framework Foundation \
            -x objective-c - \
            -o "${RUNNER_TEMP}/ys-spm-consumer" <<'EOF'
          #import <YSIFLYADLib/YSIFLYADLib.h>
          int main(void) {
            @autoreleasepool {
              NSLog(@"linked %@", [YSIFLYAdBase class]);
            }
            return 0;
          }
          EOF

  consume-cocoapods-release:
    name: Simple YSIFLYADLibSimple｜lint 并实际消费 CocoaPods/Demo 资产
    if: needs.resolve-validation-mode.outputs.mode != 'repository'
    needs: [resolve-validation-mode, verify-repository, validate-release-assets]
    runs-on: macos-15
    timeout-minutes: 55
    permissions:
      contents: read
    outputs:
      simple_result_json: ${{ steps.simple-result.outputs.json }}
    env:
      RELEASE_MODE: ${{ needs.verify-repository.outputs.mode }}
      RELEASE_TAG: ${{ needs.verify-repository.outputs.version }}
      CANDIDATE_RELEASE_ID: ${{ needs.verify-repository.outputs.candidate_release_id }}
      CANDIDATE_ID: ${{ needs.verify-repository.outputs.candidate_id }}
      CANDIDATE_BRANCH: ${{ needs.verify-repository.outputs.candidate_branch }}
      EXPECTED_CHECKOUT_COMMIT: ${{ needs.verify-repository.outputs.checkout_commit }}
      EXPECTED_SPM_SHA256: ${{ needs.validate-release-assets.outputs.spm_sha256 }}
      EXPECTED_COMBINED_SHA256: ${{ needs.validate-release-assets.outputs.combined_sha256 }}
      EXPECTED_CHECKSUMS_SHA256: ${{ needs.validate-release-assets.outputs.checksums_sha256 }}
      # job 级 env 不能引用 runner context；github.workspace 在解析期可用，
      # 实际目录仍由消费步骤先清理并只保存本次候选的本地 fixture。
      COCOAPODS_FIXTURE: ${{ github.workspace }}/.candidate-cocoapods-fixture
      WORKFLOW_CONTROL_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-repository.outputs.checkout_commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: 校验 CocoaPods 消费 checkout 与前置提交绑定
        run: |
          test "$(git rev-parse HEAD)" = "${EXPECTED_CHECKOUT_COMMIT}"
          test -z "$(git status --porcelain)"

      - name: 正式模式下载前置 job 固化的公开资产
        if: env.RELEASE_MODE == 'formal_release'
        uses: actions/download-artifact@v4
        with:
          name: ys-release-assets-${{ needs.verify-repository.outputs.candidate_identity }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ys-release

      - name: Draft CocoaPods 消费端独立下载三资产
        if: env.RELEASE_MODE == 'draft_candidate'
        env:
          # Token 只存在本下载步骤；后续哈希绑定、lint 与 Demo 构建均不注入。
          GITHUB_TOKEN: ${{ secrets.DRAFT_RELEASE_READ_TOKEN }}
        run: |
          rm -rf "${RUNNER_TEMP}/ys-release"
          git show \
            "${WORKFLOW_CONTROL_SHA}:.github/scripts/download_release_assets.py" |
            python3 - \
              --mode draft_candidate \
              --repository "${GITHUB_REPOSITORY}" \
              --version "${RELEASE_TAG}" \
              --expected-commit "${EXPECTED_CHECKOUT_COMMIT}" \
              --candidate-release-id "${CANDIDATE_RELEASE_ID}" \
              --candidate-id "${CANDIDATE_ID}" \
              --target-branch "${CANDIDATE_BRANCH}" \
              --destination "${RUNNER_TEMP}/ys-release"

      - name: 无 Token 校验 CocoaPods 消费资产与前置哈希完全绑定
        run: |
          unset GH_TOKEN GITHUB_TOKEN GITHUB_AUTH_TOKEN ACTIONS_RUNTIME_TOKEN
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "ys-release"
          version = os.environ["RELEASE_TAG"]
          expected = {
              "YSIFLYADLib.xcframework.zip": os.environ["EXPECTED_SPM_SHA256"],
              f"YSIFLYADLib-{version}.zip": os.environ["EXPECTED_COMBINED_SHA256"],
              "checksums.txt": os.environ["EXPECTED_CHECKSUMS_SHA256"],
          }
          actual = {path.name for path in root.iterdir()}
          assert actual == set(expected), (actual, set(expected))
          for name, expected_sha in expected.items():
              assert len(expected_sha) == 64
              actual_sha = hashlib.sha256((root / name).read_bytes()).hexdigest()
              assert actual_sha == expected_sha, (name, actual_sha, expected_sha)
          print("CocoaPods 消费资产与前置 SHA-256 绑定通过")
          PY

      - name: 正式首次 CocoaPods 消费前显式清空缓存
        if: env.RELEASE_MODE == 'formal_release'
        run: |
          pod cache clean YSIFLYADLib --all || true
          rm -rf \
            "${HOME}/Library/Caches/CocoaPods/Pods" \
            "${COCOAPODS_FIXTURE}" \
            "${RUNNER_TEMP}/ys-pod-derived"

      - name: 生成只引用已验证合并 zip 的本地 podspec 并执行 lint
        run: |
          unset GH_TOKEN GITHUB_TOKEN GITHUB_AUTH_TOKEN ACTIONS_RUNTIME_TOKEN
          rm -rf "${COCOAPODS_FIXTURE}"
          git show \
            "${WORKFLOW_CONTROL_SHA}:.github/scripts/prepare_cocoapods_fixture.py" |
            python3 - \
              --release-dir "${RUNNER_TEMP}/ys-release" \
              --output "${COCOAPODS_FIXTURE}" \
              --version "${RELEASE_TAG}"
          pod spec lint \
            "${COCOAPODS_FIXTURE}/YSIFLYADLib.podspec" \
            --allow-warnings

      - name: 使用本次已验证 CocoaPods 资产编译 Demo 并校验最终 -ObjC
        run: |
          unset GH_TOKEN GITHUB_TOKEN GITHUB_AUTH_TOKEN ACTIONS_RUNTIME_TOKEN
          demo_dir="${COCOAPODS_FIXTURE}/YSIFLYADLibSimple"
          pod install --project-directory="${demo_dir}"

          python3 - <<'PY'
          import os
          import shlex
          from pathlib import Path

          support_root = (
              Path(os.environ["COCOAPODS_FIXTURE"])
              / "YSIFLYADLibSimple/Pods/Target Support Files"
          )
          configs = {
              "pod target": support_root
              / "YSIFLYADLib/YSIFLYADLib.debug.xcconfig",
              "aggregate target": support_root
              / "Pods-YSIFLYADLibSimple/Pods-YSIFLYADLibSimple.debug.xcconfig",
          }
          for label, path in configs.items():
              assert path.is_file(), f"缺少 {label} xcconfig: {path}"
              values = [
                  line.split("=", 1)[1].strip()
                  for line in path.read_text(encoding="utf-8").splitlines()
                  if line.strip().startswith("OTHER_LDFLAGS") and "=" in line
              ]
              assert any("-ObjC" in shlex.split(value) for value in values), path
              print(f"OK {label}: {path}")
          PY

          xcodebuild build \
            -workspace "${demo_dir}/YSIFLYADLibSimple.xcworkspace" \
            -scheme YSIFLYADLibSimple \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/ys-pod-derived" \
            CODE_SIGNING_ALLOWED=NO

          xcodebuild \
            -workspace "${demo_dir}/YSIFLYADLibSimple.xcworkspace" \
            -scheme YSIFLYADLibSimple \
            -configuration Debug \
            -sdk iphonesimulator \
            -showBuildSettings \
            -json > "${RUNNER_TEMP}/ys-build-settings.json"

          python3 - <<'PY'
          import json
          import os
          import shlex
          from pathlib import Path

          settings = Path(os.environ["RUNNER_TEMP"]) / "ys-build-settings.json"
          records = json.loads(settings.read_text(encoding="utf-8"))
          apps = [item for item in records if item.get("target") == "YSIFLYADLibSimple"]
          assert len(apps) == 1, len(apps)
          flags = apps[0].get("buildSettings", {}).get("OTHER_LDFLAGS", "")
          assert "-ObjC" in shlex.split(flags), flags
          print(f"OK 最终 App OTHER_LDFLAGS: {flags}")
          PY

      - name: 输出统一 Simple 验证结果
        id: simple-result
        env:
          RELEASE_ID: ${{ needs.validate-release-assets.outputs.release_id }}
        run: |
          python3 - <<'PY'
          import json, os
          inventory = json.load(open("release-state.json", encoding="utf-8"))["artifactInventory"]["sha256"]
          value = json.dumps({"schemaVersion": 1, "channel": "ys",
              "simpleScheme": "YSIFLYADLibSimple", "releaseId": int(os.environ["RELEASE_ID"]),
              "artifactInventorySha256": inventory, "buildResult": "success",
              "runId": int(os.environ["GITHUB_RUN_ID"])}, separators=(",", ":"), sort_keys=True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"json={value}\n")
          print(value)
          PY

  release-summary:
    name: 发布验证只读汇总
    if: ${{ always() }}
    needs:
      - resolve-validation-mode
      - verify-repository
      - validate-release-assets
      - consume-swiftpm-release
      - consume-cocoapods-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      RELEASE_MODE: ${{ needs.verify-repository.outputs.mode || needs.resolve-validation-mode.outputs.mode }}
      RELEASE_TAG: ${{ needs.verify-repository.outputs.version || needs.resolve-validation-mode.outputs.release_tag }}
      RELEASE_ID: ${{ needs.validate-release-assets.outputs.release_id }}
      CANDIDATE_ID: ${{ needs.verify-repository.outputs.candidate_id }}
      CANDIDATE_IDENTITY: ${{ needs.verify-repository.outputs.candidate_identity }}
      CHECKOUT_COMMIT: ${{ needs.verify-repository.outputs.checkout_commit || github.sha }}
      SPM_SHA256: ${{ needs.validate-release-assets.outputs.spm_sha256 }}
      COMBINED_SHA256: ${{ needs.validate-release-assets.outputs.combined_sha256 }}
      CHECKSUMS_SHA256: ${{ needs.validate-release-assets.outputs.checksums_sha256 }}
      RESOLVE_RESULT: ${{ needs.resolve-validation-mode.result }}
      REPOSITORY_RESULT: ${{ needs.verify-repository.result }}
      ASSETS_RESULT: ${{ needs.validate-release-assets.result }}
      SWIFTPM_RESULT: ${{ needs.consume-swiftpm-release.result }}
      COCOAPODS_RESULT: ${{ needs.consume-cocoapods-release.result }}
      SIMPLE_RESULT_JSON: ${{ needs.consume-cocoapods-release.outputs.simple_result_json }}
    steps:
      - name: 写入身份、库存与 job 结论
        shell: bash
        run: |
          set -euo pipefail
          value_or_none() {
            if [[ -n "$1" ]]; then
              printf '%s' "$1"
            else
              printf '%s' '<无>'
            fi
          }
          {
            echo '## 发布验证汇总'
            echo
            echo '| 字段 | 值 |'
            echo '| --- | --- |'
            printf '| 模式 | `%s` |\n' "$(value_or_none "$RELEASE_MODE")"
            printf '| Candidate ID | `%s` |\n' "$(value_or_none "$CANDIDATE_ID")"
            printf '| Candidate 身份 | `%s` |\n' "$(value_or_none "$CANDIDATE_IDENTITY")"
            printf '| Release ID | `%s` |\n' "$(value_or_none "$RELEASE_ID")"
            printf '| Release tag | `%s` |\n' "$(value_or_none "$RELEASE_TAG")"
            printf '| Checkout commit | `%s` |\n' "$(value_or_none "$CHECKOUT_COMMIT")"
            printf '| SwiftPM 资产 SHA-256 | `%s` |\n' "$(value_or_none "$SPM_SHA256")"
            printf '| 合并资产 SHA-256 | `%s` |\n' "$(value_or_none "$COMBINED_SHA256")"
            printf '| checksums.txt SHA-256 | `%s` |\n' "$(value_or_none "$CHECKSUMS_SHA256")"
            echo
            echo '| Job | 结论 |'
            echo '| --- | --- |'
            printf '| resolve-validation-mode | `%s` |\n' "$RESOLVE_RESULT"
            printf '| verify-repository | `%s` |\n' "$REPOSITORY_RESULT"
            printf '| validate-release-assets | `%s` |\n' "$ASSETS_RESULT"
            printf '| consume-swiftpm-release | `%s` |\n' "$SWIFTPM_RESULT"
            printf '| consume-cocoapods-release | `%s` |\n' "$COCOAPODS_RESULT"
            echo
            echo '### Simple 结构化结果'
            printf '```json\n%s\n```\n' "${SIMPLE_RESULT_JSON:-{}}"
          } >> "$GITHUB_STEP_SUMMARY"

          for result in \
            "$RESOLVE_RESULT" "$REPOSITORY_RESULT" "$ASSETS_RESULT" \
            "$SWIFTPM_RESULT" "$COCOAPODS_RESULT"; do
            case "$result" in
              failure|cancelled|timed_out|action_required) exit 1 ;;
            esac
          done
          test "$RESOLVE_RESULT" = 'success'
          test "$REPOSITORY_RESULT" = 'success'
          if [[ "$RELEASE_MODE" != 'repository' ]]; then
            test "$ASSETS_RESULT" = 'success'
            test "$SWIFTPM_RESULT" = 'success'
            test "$COCOAPODS_RESULT" = 'success'
            [[ "$SPM_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$COMBINED_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$CHECKSUMS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          fi

# 普通 PR/main/tag push 与空 release_tag 的 repository 模式只执行本地门禁。
# repository + 非空 release_tag 兼容旧调用并推导 formal_release；正式资产始终无 Token 匿名下载。
# draft candidate 仅允许从精确 release-candidate 分支手动触发，未公开二进制不上传 Actions artifact；前置 job
# 只传递哈希，两个并行 consumer 各自在唯一 Token 步骤重新下载并绑定后消费。
